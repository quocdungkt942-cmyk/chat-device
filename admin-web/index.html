<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat Device V4</title><style>body{font-family:Arial;margin:0;background:#f3f5f7;color:#18202a}header{padding:16px 20px;background:#18202a;color:white}main{max-width:1200px;margin:auto;padding:20px}.card{background:white;padding:18px;border-radius:12px;margin-bottom:15px}.grid{display:grid;grid-template-columns:300px 1fr;gap:15px}.device{padding:12px;border:1px solid #ddd;border-radius:9px;margin:7px 0;cursor:pointer}.active{border:2px solid #1671d9}input,button{padding:10px;border-radius:8px;border:1px solid #ccc}.row{display:flex;gap:8px}.row input{flex:1}#messages{height:330px;overflow:auto;border:1px solid #ddd;padding:10px}.msg{padding:8px;margin:6px 0;background:#edf4ff;border-radius:8px}.hidden{display:none}.file{padding:8px;border-bottom:1px solid #eee}</style></head><body><header><b>Chat Device V4</b></header><main><div id="login" class="card"><h2>Đăng nhập Admin</h2><div class="row"><input id="user" value="admin"><input id="pass" type="password" placeholder="Mật khẩu"><button onclick="login()">Đăng nhập</button></div><p id="loginMsg"></p></div><div id="app" class="hidden grid"><div class="card"><button onclick="loadDevices()">Làm mới</button><div id="devices"></div></div><div class="card"><h2 id="title">Chọn thiết bị</h2><div id="messages"></div><div class="row"><input id="text" placeholder="Tin nhắn..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Gửi</button></div><h3>File đã chia sẻ</h3><div id="files"></div></div></div></main><script>const API=localStorage.getItem("CHAT_SERVER")||"http://localhost:3000";let token="",selected="",ws;const H=()=>({Authorization:"Bearer "+token});const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function login(){let r=await fetch(API+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:user.value,password:pass.value})});let x=await r.json();if(!r.ok){loginMsg.textContent=x.error;return}token=x.token;login.classList.add("hidden");app.classList.remove("hidden");loadDevices()}async function loadDevices(){let a=await(await fetch(API+"/api/devices",{headers:H()})).json();devices.innerHTML=a.map(d=>`<div class="device ${selected===d.deviceId?'active':''}" onclick="selectDevice('${esc(d.deviceId)}')"><b>${esc(d.name)}</b><br><small>${esc(d.model)}<br>Mã: ${esc(d.pairingCode)}</small></div>`).join("")||"Chưa có thiết bị"}async function selectDevice(id){selected=id;await loadDevices();let a=await(await fetch(API+"/api/devices",{headers:H()})).json(),d=a.find(x=>x.deviceId===id);title.textContent=d?.name||id;loadMessages();loadFiles();connect()}async function loadMessages(){let a=await(await fetch(API+"/api/messages/"+encodeURIComponent(selected),{headers:H()})).json();messages.innerHTML=a.map(m=>`<div class="msg"><b>${esc(m.sender)}</b>: ${esc(m.text)}<br><small>${esc(m.createdAt)}</small></div>`).join("")}async function loadFiles(){let a=await(await fetch(API+"/api/devices/"+encodeURIComponent(selected)+"/files",{headers:H()})).json();files.innerHTML=a.map(f=>`<div class="file"><b>${esc(f.originalName)}</b> — <a href="${API+f.url}" target="_blank">Mở/tải</a></div>`).join("")||"Chưa có file"}function connect(){if(ws)try{ws.close()}catch{}ws=new WebSocket(API.replace(/^http/,"ws"));ws.onopen=()=>ws.send(JSON.stringify({type:"auth",role:"admin",token}));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.text&&m.deviceId===selected)loadMessages()}}function send(){let t=text.value.trim();if(!t||!selected)return;if(!ws||ws.readyState!==1){connect();setTimeout(send,500);return}ws.send(JSON.stringify({type:"chat",deviceId:selected,sender:"admin",text:t}));text.value="";setTimeout(loadMessages,150)}</script></body></html>
